# Local MySQL 8 for development. Hostinger Web apps plans provide MySQL, so we match it.
# Start:  docker compose -f docker/dev.yml up -d
# Stop:   docker compose -f docker/dev.yml down      (add -v to wipe the data)
# URL:    mysql://forgekit:forgekit@127.0.0.1:3306/forgekit
name: forgekit-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: forgekit
      MYSQL_USER: forgekit
      MYSQL_PASSWORD: forgekit
      MYSQL_ROOT_PASSWORD: forgekit-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uforgekit", "-pforgekit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
