# Local MySQL 8 for development. Hostinger Web apps plans provide MySQL, so we match it.
# Start:  docker compose -f docker/dev.yml up -d
# Stop:   docker compose -f docker/dev.yml down      (add -v to wipe the data)
# URL:    mysql://ingotkit:ingotkit@127.0.0.1:3306/ingotkit
name: ingotkit-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ingotkit
      MYSQL_USER: ingotkit
      MYSQL_PASSWORD: ingotkit
      MYSQL_ROOT_PASSWORD: ingotkit-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uingotkit", "-pingotkit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
